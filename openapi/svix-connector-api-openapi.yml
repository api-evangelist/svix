        source: "response, err := svix.Connector.Create(\n\tctx,\n\tConnectorIn{\n\t\tName:              \"My first connector\",\n\t\tUid:               new(\"unique-identifier\"),\n\t\tLogo:              new(\"https://example.com/logo.png\"),\n\t\tDescription:       new(\"Example connector description\"),\n\t\tKind:              new(CONNECTORKIND_CUSTOM),\n\t\tInstructions:      new(\"Markdown-formatted instructions\"),\n\t\tAllowedEventTypes: []string{\"user.signup\", \"user.deleted\"},\n\t\tTransformation:    \"function handler(webhook) { /* ... */ }\",\n\t\tFeatureFlags:      []string{},\n\t\tProductType:       new(CONNECTORPRODUCT_DISPATCH),\n\t},\n\tnil,\n)"
