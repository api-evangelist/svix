tags:
- name: Connector
  description: Connectors allow you to connect applications to external services.
paths:
  /api/v1/connector:
    get:
      tags:
      - Connector
      summary: List Connectors
      description: List all connectors for an application.
      operationId: v1.connector.list
      parameters:
      - in: query
        name: limit
        description: Limit the number of returned items
        schema:
          description: Limit the number of returned items
          type: integer
          format: uint64
          maximum: 250.0
          minimum: 1.0
        style: form
      - in: query
        name: iterator
        description: The iterator returned from a prior invocation
        schema:
          description: The iterator returned from a prior invocation
          type: string
          maxLength: 34
          minLength: 34
          pattern: ^trtmpl_[A-Za-z0-9]{27}$
          nullable: true
          example: trtmpl_1srOrx2ZWZBpBUvZwXKQmoEYga2
        style: form
      - in: query
        name: order
        description: The sorting order of the returned items
        schema:
          description: The sorting order of the returned items
          $ref: '#/components/schemas/Ordering'
          nullable: true
        style: form
      - in: query
        name: product_type
        schema:
          $ref: '#/components/schemas/ConnectorProduct'
          nullable: true
        style: form
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse_ConnectorOut_'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpErrorOut'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpErrorOut'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpErrorOut'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpErrorOut'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpErrorOut'
      security:
      - HTTPBearer: []
      x-codeSamples:
      - label: JavaScript
        lang: TypeScript
        source: const response = await svix.connector.list();
      - label: TypeScript
        lang: TypeScript
        source: const response = await svix.connector.list();
      - label: Python
        lang: Python
        source: response = svix.connector.list()
      - label: Python (Async)
        lang: Python
        source: response = await svix.connector.list()
      - label: Go
        lang: Go
        source: response, err := svix.Connector.List(ctx, nil)
      - label: Kotlin
        lang: Kotlin
        source: val response = svix.connector.list()
      - label: Java
        lang: Java
        source: var response = svix.getConnector().list();
      - label: Ruby
        lang: Ruby
        source: response = svix.connector.list
      - label: Rust
        lang: Rust
        source: let response = svix.connector().list(None).await?;
      - label: C#
        lang: C#
        source: var response = svix.Connector.List();
      - label: PHP
        lang: PHP
        source: $response = $svix->connector->list();
      - label: CLI
        lang: Shell
        source: svix connector list
      - label: cURL
        lang: Shell
        source: "curl -X 'GET' \\\n  'https://api.eu.svix.com/api/v1/connector' \\\n  -H 'Authorization: Bearer AUTH_TOKEN' \\\n  -H 'Accept: application/json'"
