  /api/v1/connector/{connector_id}:
    get:
      tags:
      - Connector
      summary: Get Connector
      description: Get a connector.
      operationId: v1.connector.get
      parameters:
      - in: path
        name: connector_id
        description: The Connector's ID or UID.
        required: true
        schema:
          description: The Connector's ID or UID.
          type: string
          maxLength: 256
          minLength: 1
          pattern: ^[a-zA-Z0-9\-_.]+$
          example: unique-identifier
        style: simple
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorOut'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpErrorOut'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpErrorOut'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpErrorOut'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpErrorOut'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpErrorOut'
      security:
      - HTTPBearer: []
      x-codeSamples:
      - lang: TypeScript
        label: JavaScript
        source: const response = await svix.connector.get("connector_id");
      - lang: TypeScript
        label: TypeScript
        source: const response = await svix.connector.get("connector_id");
      - lang: Python
        label: Python
        source: "response = svix.connector.get(\n    \"connector_id\",\n)"
      - lang: Python
        label: Python (Async)
        source: "response = await svix.connector.get(\n    \"connector_id\",\n)"
      - lang: Go
        label: Go
        source: response, err := svix.Connector.Get(ctx, "connector_id")
      - lang: Kotlin
        label: Kotlin
        source: val response = svix.connector.get("connector_id")
      - lang: Java
        label: Java
        source: var response = svix.getConnector().get("connector_id");
      - lang: Ruby
        label: Ruby
        source: response = svix.connector.get("connector_id")
      - lang: Rust
        label: Rust
        source: let response = svix.connector().get("connector_id".to_string()).await?;
      - lang: C#
        label: C#
        source: var response = svix.Connector.Get("connector_id");
      - lang: PHP
