components:
  schemas:
    EventTypeIn:
      type: object
      properties:
        name:
          description: The event type's name
          type: string
          maxLength: 256
          pattern: ^[a-zA-Z0-9\-_.]+$
          example: user.signup
        description:
          type: string
          example: A user has signed up
        archived:
          type: boolean
          default: false
          example: false
        deprecated:
          type: boolean
          default: false
        schemas:
          description: The schema for the event type for a specific version as a JSON schema.
          type: object
          nullable: true
          additionalProperties: true
          example:
            '1':
              title: Invoice Paid Event
              description: An invoice was paid by a user
              type: object
              properties:
                invoiceId:
                  description: The invoice id
                  type: string
                userId:
                  description: The user id
                  type: string
              required:
              - invoiceId
              - userId
        groupName:
          description: The event type group's name
          type: string
          maxLength: 256
          pattern: ^[a-zA-Z0-9\-_.]+$
          example: user
          nullable: true
        featureFlags:
          type: array
          default: null
          nullable: true
          items:
            type: string
            maxLength: 256
            pattern: ^[a-zA-Z0-9\-_.]+$
          minItems: 1
          uniqueItems: true
          example:
          - cool-new-feature
        featureFlag:
          description: Deprecated, use `featureFlags` instead.
          type: string
          default: null
          deprecated: true
          maxLength: 256
          pattern: ^[a-zA-Z0-9\-_.]+$
          nullable: true
      required:
      - description
      - name
    EventTypeImportOpenApiOut:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/EventTypeImportOpenApiOutData'
      required:
      - data
