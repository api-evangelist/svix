      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/EventTypeOut'
        iterator:
          type: string
          nullable: true
          example: iterator
        prevIterator:
          type: string
          nullable: true
          example: -iterator
        done:
          type: boolean
      required:
      - data
      - done
      - iterator
    BackgroundTaskStatus:
      type: string
      enum:
      - running
