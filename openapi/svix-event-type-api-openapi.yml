    delete:
      tags:
      - Event Type
      summary: Delete Event Type
      description: 'Archive an event type.


        Endpoints already configured to filter on an event type will continue to do so after archival.

        However, new messages can not be sent with it and endpoints can not filter on it.

        An event type can be unarchived with the

        [create operation](#operation/create_event_type_api_v1_event_type__post).'
      operationId: v1.event-type.delete
      parameters:
      - in: path
        name: event_type_name
        description: The event type's name
        required: true
        schema:
          description: The event type's name
          type: string
          maxLength: 256
          pattern: ^[a-zA-Z0-9\-_.]+$
          example: user.signup
        style: simple
      - in: query
        name: expunge
        description: By default event types are archived when "deleted". Passing this to `true` deletes them entirely.
        schema:
          description: By default event types are archived when "deleted". Passing this to `true` deletes them entirely.
          type: boolean
          default: false
        style: form
      responses:
        '204':
          description: no content
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpErrorOut'
        '401':
          description: Unauthorized
          content:
            application/json:
