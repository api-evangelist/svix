      description: 'Import a list of event types from webhooks defined in an OpenAPI spec.


        The OpenAPI spec can be specified as either `spec` given the spec as a JSON object, or as `specRaw` (a `string`) which will be parsed as YAML or JSON by the server. Sending neither or both is invalid, resulting in a `400` **Bad Request**.'
      type: object
      properties:
        dryRun:
          description: If `true`, return the event types that would be modified without actually modifying them.
          type: boolean
          default: false
        replaceAll:
          description: If `true`, all existing event types that are not in the spec will be archived.
          type: boolean
          default: false
        spec:
          description: A pre-parsed JSON spec.
          type: object
          nullable: true
          additionalProperties: true
          example:
            openapi: 3.1.0
            info:
              title: Webhook Example
              version: 1.0.0
            webhooks:
              pet.new:
                post:
                  requestBody:
                    description: Information about a new pet in the system
                    content:
                      application/json:
                        schema:
