      security:
      - HTTPBearer: []
      x-codeSamples:
      - lang: TypeScript
        label: JavaScript
        source: const response = await svix.environment.export();
      - lang: TypeScript
        label: TypeScript
        source: const response = await svix.environment.export();
      - lang: Python
        label: Python
        source: response = svix.environment.export()
      - lang: Python
        label: Python (Async)
        source: response = await svix.environment.export()
      - lang: Go
        label: Go
        source: response, err := svix.Environment.Export(ctx, nil)
      - lang: Kotlin
        label: Kotlin
        source: val response = svix.environment.export()
      - lang: Java
        label: Java
        source: var response = svix.getEnvironment().export();
      - lang: Ruby
        label: Ruby
        source: response = svix.environment.export
      - lang: Rust
        label: Rust
        source: let response = svix.environment().export(None).await?;
      - lang: C#
        label: C#
        source: var response = svix.Environment.Export();
      - lang: PHP
        label: PHP
        source: $response = $svix->environment->export();
      - lang: Shell
        label: CLI
        source: svix environment export
      - lang: Shell
        label: cURL
        source: "curl -X 'POST' \\\n  'https://api.eu.svix.com/api/v1/environment/export' \\\n  -H 'Authorization: Bearer AUTH_TOKEN' \\\n  -H 'Accept: application/json'"
  /api/v1/environment/import:
    post:
      tags:
      - Environment
      summary: Import Environment Configuration
      description: 'Import a configuration into the active organization.


        It doesn''t delete anything, only adds / updates what was passed to it.


        Note that the schema for [`EnvironmentIn`] is subject to change. The fields

        herein are provided for convenience but should be treated as JSON blobs.'
      operationId: v1.environment.import
      parameters:
      - in: header
        name: idempotency-key
        description: The request's idempotency key
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvironmentIn'
        required: true
      responses:
        '204':
          description: no content
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpErrorOut'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpErrorOut'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpErrorOut'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpErrorOut'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpErrorOut'
      security:
      - HTTPBearer: []
      x-codeSamples:
      - lang: TypeScript
        label: JavaScript
        source: "await svix.environment.import({\n  eventTypes: [],\n  settings: {},\n  connectors: [],\n});"
      - lang: TypeScript
        label: TypeScript
        source: "await svix.environment.import({\n  eventTypes: [],\n  settings: {},\n  connectors: [],\n});"
      - lang: Python
        label: Python
        source: "svix.environment.import_(\n    EnvironmentIn(\n        event_types=[],\n        settings={},\n        connectors=[],\n    ),\n)"
      - lang: Python
        label: Python (Async)
        source: "await svix.environment.import_(\n    EnvironmentIn(\n        event_types=[],\n        settings={},\n        connectors=[],\n    ),\n)"
      - lang: Go
        label: Go
        source: "err := svix.Environment.Import(\n\tctx,\n\tEnvironmentIn{EventTypes: []EventTypeIn{}, Settings: nil, Connectors: []ConnectorIn{}},\n\tnil,\n)"
      - lang: Kotlin
        label: Kotlin
        source: "svix.environment.import(\n    EnvironmentIn(eventTypes = listOf(), settings = mapOf(), connectors = listOf())\n)"
      - lang: Java
        label: Java
        source: "svix.getEnvironment()\n        .import_(\n            new EnvironmentIn().eventTypes(List.of()).settings(Map.of()).connectors(List.of()));"
      - lang: Ruby
        label: Ruby
        source: 'response = svix.environment.import({eventTypes: [], settings: {}, connectors: []})'
      - lang: Rust
        label: Rust
        source: "svix.environment()\n    .import(\n        EnvironmentIn {\n            event_types: Some(vec![]),\n            settings: Some(serde_json::json!({})),\n            connectors: Some(vec![]),\n        },\n        None,\n    )\n    .await?;"
      - lang: C#
        label: C#
        source: "var response = svix.Environment.Import(\n    new EnvironmentIn\n    {\n        EventTypes = [],\n        Settings = new Dictionary<string, string> { },\n        Connectors = [],\n    }\n);"
      - lang: PHP
        label: PHP
        source: "$svix->environment->import(\n    EnvironmentIn::create()\n    ->withEventTypes([])\n    ->withConnectors([])\n);"
      - lang: Shell
        label: CLI
        source: "svix environment import '{\n    \"eventTypes\": [],\n    \"settings\": {},\n    \"connectors\": []\n  }'"
      - lang: Shell
        label: cURL
        source: "curl -X 'POST' \\\n  'https://api.eu.svix.com/api/v1/environment/import' \\\n  -H 'Authorization: Bearer AUTH_TOKEN' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\n    \"eventTypes\": [],\n    \"settings\": {},\n    \"connectors\": []\n  }'"
components:
  schemas:
    EnvironmentOut:
      type: object
      properties:
        version:
          type: integer
          format: int
          default: 1
        createdAt:
          type: string
          format: date-time
        eventTypes:
          type: array
          items:
            $ref: '#/components/schemas/EventTypeOut'
        settings:
          type: object
          additionalProperties: true
          nullable: true
        connectors:
          type: array
          items:
            $ref: '#/components/schemas/ConnectorOut'
      required:
      - connectors
      - createdAt
      - eventTypes
      - settings
    EnvironmentIn:
      type: object
      properties:
        eventTypes:
          type: array
          items:
            $ref: '#/components/schemas/EventTypeIn'
          nullable: true
        settings:
          type: object
          additionalProperties: true
          nullable: true
        connectors:
          type: array
          items:
            $ref: '#/components/schemas/ConnectorIn'
          nullable: true
    ConnectorKind:
      type: string
      enum:
      - Custom
      - AgenticCommerceProtocol
      - CloseCRM
      - CustomerIO
      - Discord
      - Hubspot
      - Inngest
      - Loops
      - Otel
      - Resend
      - Salesforce
      - Segment
      - Sendgrid
      - Slack
      - Teams
      - TriggerDev
      - Windmill
      - Zapier
    HttpErrorOut:
      title: HttpError
      type: object
      properties:
        code:
          type: string
        detail:
          type: string
      required:
      - code
      - detail
    EnvironmentRegion:
      type: string
      enum:
      - eu
      - us
      - au
      - ca
      - self-hosted
    EnvironmentModelIn:
      type: object
      properties:
        name:
          description: Environment name for human consumption.
          type: string
          minLength: 1
          maxLength: 255
          example: My environment
        type:
          $ref: '#/components/schemas/EnvironmentType'
          example: development
      required:
      - name
      - type
    EventTypeIn:
      type: object
      properties:
        name:
          description: The event type's name
          type: string
          maxLength: 256
          pattern: ^[a-zA-Z0-9\-_.]+$
          example: user.signup
        description:
          type: string
          example: A user has signed up
        archived:
          type: boolean
          default: false
          example: false
        deprecated:
          type: boolean
          default: false
        schemas:
          description: The schema for the event type for a specific version as a JSON schema.
          type: object
          nullable: true
          additionalProperties: true
          example:
            '1':
              title: Invoice Paid Event
              description: An invoice was paid by a user
              type: object
              properties:
                invoiceId:
                  description: The invoice id
                  type: string
                userId:
                  description: The user id
                  type: string
              required:
              - invoiceId
              - userId
        groupName:
          description: The event type group's name
          type: string
          maxLength: 256
          pattern: ^[a-zA-Z0-9\-_.]+$
          example: user
          nullable: true
        featureFlags:
          type: array
          default: null
          nullable: true
          items:
            type: string
            maxLength: 256
            pattern: ^[a-zA-Z0-9\-_.]+$
          minItems: 1
          uniqueItems: true
          example:
          - cool-new-feature
        featureFlag:
          description: Deprecated, use `featureFlags` instead.
          type: string
          default: null
          deprecated: true
          maxLength: 256
          pattern: ^[a-zA-Z0-9\-_.]+$
          nullable: true
      required:
      - description
      - name
    ConnectorIn:
      type: object
      properties:
        name:
          type: string
          example: My first connector
        uid:
          description: The Connector's UID.
          type: string
          maxLength: 256
          minLength: 1
          pattern: ^[a-zA-Z0-9\-_.]+$
          example: unique-identifier
          nullable: true
        logo:
          type: string
          format: uri
          nullable: true
          example: https://example.com/logo.png
        description:
          type: string
          default: ''
          example: Example connector description
        kind:
          default: Custom
          $ref: '#/components/schemas/ConnectorKind'
          example: Slack
        instructions:
          type: string
          default: ''
          example: Markdown-formatted instructions
        allowedEventTypes:
          type: array
          nullable: true
          items:
            description: The event type's name
            type: string
            maxLength: 256
            pattern: ^[a-zA-Z0-9\-_.]+$
            example: user.signup
          minItems: 1
          uniqueItems: true
          example:
          - user.signup
          - user.deleted
        transformation:
          type: string
          minLength: 10
          maxLength: 51200
          example: function handler(webhook) { /* ... */ }
        featureFlags:
          type: array
          default: null
          items:
            type: string
            maxLength: 256
            pattern: ^[a-zA-Z0-9\-_.]+$
          uniqueItems: true
          nullable: true
        productType:
          default: null
          $ref: '#/components/schemas/ConnectorProduct'
          nullable: true
      required:
      - name
      - transformation
    EnvironmentModelUpdate:
      type: object
      properties:
        name:
          description: Environment name for human consumption.
          type: string
          minLength: 1
          maxLength: 255
          example: My environment
      required:
      - name
    ConnectorOut:
      type: object
      properties:
        id:
          description: The Connector's ID.
          type: string
          maxLength: 34
          minLength: 34
          pattern: ^trtmpl_[A-Za-z0-9]{27}$
          example: trtmpl_1srOrx2ZWZBpBUvZwXKQmoEYga2
        orgId:
          description: The Environment's ID.
          type: string
          maxLength: 31
          minLength: 31
          pattern: ^org_[A-Za-z0-9]{27}$
          example: org_1srOrx2ZWZBpBUvZwXKQmoEYga2
        uid:
          description: The Connector's UID.
          type: string
          maxLength: 256
          minLength: 1
          pattern: ^[a-zA-Z0-9\-_.]+$
          example: unique-identifier
          nullable: true
        kind:
          $ref: '#/components/schemas/ConnectorKind'
        name:
          type: string
        logo:
          type: string
          format: uri
          nullable: true
        description:
          type: string
        instructions:
          type: string
        allowedEventTypes:
          type: array
          nullable: true
          items:
            description: The event type's name
            type: string
            maxLength: 256
            pattern: ^[a-zA-Z0-9\-_.]+$
            example: user.signup
          minItems: 1
          uniqueItems: true
          example:
          - user.signup
          - user.deleted
        transformation:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        transformationUpdatedAt:
          type: string
          format: date-time
        featureFlags:
          type: array
          default: null
          nullable: true
          items:
            type: string
            maxLength: 256
            pattern: ^[a-zA-Z0-9\-_.]+$
          uniqueItems: true
          example:
          - cool-new-feature
        productType:
          $ref: '#/components/schemas/ConnectorProduct'
      required:
      - createdAt
      - description
      - id
      - instructions
      - kind
      - name
      - orgId
      - productType
      - transformation
      - transformationUpdatedAt
      - updatedAt
    ConnectorProduct:
      type: string
      enum:
      - Dispatch
      - Stream
    EventTypeOut:
      type: object
      properties:
        name:
          description: The event type's name
          type: string
          maxLength: 256
          pattern: ^[a-zA-Z0-9\-_.]+$
          example: user.signup
        description:
          type: string
          example: A user has signed up
        archived:
          type: boolean
          default: false
          example: false
        deprecated:
          type: boolean
        schemas:
          description: The schema for the event type for a specific version as a JSON schema.
          type: object
          nullable: true
          additionalProperties: true
          example:
            '1':
              title: Invoice Paid Event
              description: An invoice was paid by a user
              type: object
              properties:
                invoiceId:
                  description: The invoice id
                  type: string
                userId:
                  description: The user id
                  type: string
              required:
              - invoiceId
              - userId
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        groupName:
          description: The event type group's name
          type: string
          maxLength: 256
          pattern: ^[a-zA-Z0-9\-_.]+$
          example: user
          nullable: true
        featureFlags:
          type: array
          nullable: true
          items:
            type: string
            maxLength: 256
            pattern: ^[a-zA-Z0-9\-_.]+$
          uniqueItems: true
          example:
          - cool-new-feature
        featureFlag:
          type: string
          maxLength: 256
          pattern: ^[a-zA-Z0-9\-_.]+$
          nullable: true
      required:
      - createdAt
      - deprecated
      - description
      - name
      - updatedAt
    HTTPValidationError:
      type: object
      properties:
        detail:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
      required:
      - detail
    ValidationError:
      description: Validation errors have their own schema to provide context for invalid requests eg. mismatched types and out of bounds values. There may be any number of these per 422 UNPROCESSABLE ENTITY error.
      type: object
      properties:
        loc:
          description: The location as a [`Vec`] of [`String`]s -- often in the form `["body", "field_name"]`, `["query", "field_name"]`, etc. They may, however, be arbitrarily deep.
          type: array
          items:
            type: string
        msg:
          description: The message accompanying the validation error item.
          type: string
        type:
          description: The type of error, often "type_error" or "value_error", but sometimes with more context like as "value_error.number.not_ge"
          type: string
      required:
      - loc
      - msg
      - type
    EnvironmentType:
      type: string
      enum:
      - development
      - production
    EnvironmentModelOut:
      type: object
      properties:
        id:
          description: The Environment's ID.
          type: string
          maxLength: 31
          minLength: 31
          pattern: ^org_[A-Za-z0-9]{27}$
          example: org_1srOrx2ZWZBpBUvZwXKQmoEYga2
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        region:
          $ref: '#/components/schemas/EnvironmentRegion'
        name:
          type: string
        type:
          $ref: '#/components/schemas/EnvironmentType'
      required:
      - createdAt
      - id
      - name
      - region
      - type
      - updatedAt
    Ordering:
      description: Defines the ordering in a listing of results.
      type: string
      enum:
      - ascending
      - descending
    ListResponse_EnvironmentModelOut_:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/EnvironmentModelOut'
        iterator:
          type: string
          nullable: true
          example: iterator
        prevIterator:
          type: string
          nullable: true
          example: -iterator
        done:
          type: boolean
      required:
      - data
      - done
      - iterator
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
      description: HTTP Bearer token passed in the `Authorization` header
