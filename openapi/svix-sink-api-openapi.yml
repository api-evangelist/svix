          - poller
        batchSize:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        currentIterator:
          type: string
        eventTypes:
          default: []
          type: array
          items:
            description: The event type's name
            type: string
            maxLength: 256
            pattern: ^[a-zA-Z0-9\-_.]+$
            example: user.signup
        failureReason:
          type: string
          nullable: true
        id:
          description: The sink's ID.
          type: string
          maxLength: 27
          minLength: 26
          pattern: ^sink_[A-Za-z0-9]{21,22}$
          example: sink_2yZwUhtgs5Ai8T9yRQJXA
        maxWaitSecs:
          type: integer
          format: int32
        metadata:
          type: object
          additionalProperties:
            type: string
        nextRetryAt:
          type: string
          format: date-time
          nullable: true
        status:
          $ref: '#/components/schemas/SinkStatus'
        uid:
          description: The sink's UID.
          type: string
          maxLength: 60
          minLength: 1
          pattern: ^(?!sink_)[a-zA-Z0-9_-]+$
          example: unique-identifier
          nullable: true
        updatedAt:
          type: string
          format: date-time
    SinkTransformIn:
      type: object
      properties:
        code:
          type: string
          maxLength: 51200
          minLength: 10
          nullable: true
    HttpPatchConfig:
      type: object
      properties:
        url:
          type: string
          format: uri
    EmptyResponse:
      type: object
    EndpointHeadersOut:
      description: 'The value of the headers is returned in the `headers` field.


        Sensitive headers that have been redacted are returned in the sensitive field.'
      type: object
      required:
      - headers
      - sensitive
      properties:
        headers:
          type: object
          additionalProperties:
            type: string
          example:
            X-Example: '123'
            X-Foobar: Bar
        sensitive:
          type: array
          items:
            type: string
          uniqueItems: true
          example:
          - Authorization
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
      description: HTTP Bearer token passed in the `Authorization` header
