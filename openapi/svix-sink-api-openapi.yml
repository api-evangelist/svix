components:
  schemas:
    HttpPatchConfig:
      type: object
      properties:
        url:
          type: string
          format: uri
    RedshiftPatchConfig:
      type: object
      properties:
        accessKeyId:
          type: string
        secretAccessKey:
          type: string
        region:
          type: string
        dbName:
          description: 'Database name.


            Only required if not using transformations.'
          type: string
        schemaName:
          description: 'Schema name.


            Only used if not using transformations.'
          type: string
          nullable: true
        tableName:
          description: 'Table name.


            Only required if not using transformations.'
          type: string
    AmazonS3PatchConfig:
      type: object
      properties:
        bucket:
          type: string
        accessKeyId:
          type: string
        secretAccessKey:
          type: string
        region:
          type: string
        endpointUrl:
          type: string
          format: uri
    BigQueryConfig:
      description: Configuration for a Google Cloud BigQuery sink.
      type: object
      properties:
        projectId:
          type: string
        datasetId:
          type: string
        tableId:
          type: string
        credentials:
          description: Google Cloud Credentials JSON Object as a string.
          type: string
      required:
      - credentials
      - datasetId
      - projectId
      - tableId
    SnsConfig:
      description: Configuration for a SNS sink.
      type: object
      properties:
        topicArn:
          type: string
        region:
          type: string
        accessKeyId:
          type: string
        secretAccessKey:
          type: string
        endpointUrl:
          type: string
          format: uri
          nullable: true
      required:
      - accessKeyId
      - region
      - secretAccessKey
      - topicArn
    RabbitMqConfig:
      description: Configuration for a RabbitMq sink.
      type: object
      properties:
        uri:
          type: string
        routingKey:
          type: string
      required:
      - routingKey
      - uri
    SqsConfig:
      description: Configuration for an SQS sink.
      type: object
      properties:
        queueUrl:
          type: string
          format: uri
        region:
          type: string
        accessKeyId:
          type: string
        secretAccessKey:
          type: string
        endpointUrl:
          type: string
          format: uri
          nullable: true
      required:
      - accessKeyId
      - queueUrl
      - region
      - secretAccessKey
    SinkHttpConfig:
      type: object
      properties:
        url:
          type: string
          format: uri
        headers:
          type: object
          default: {}
          additionalProperties:
            type: string
        key:
          type: string
          default: null
          nullable: true
      required:
      - url
    StreamSinkOut:
      type: object
      properties:
        id:
          description: The sink's ID.
          type: string
          maxLength: 27
          minLength: 26
          pattern: ^sink_[A-Za-z0-9]{21,22}$
          example: sink_2yZwUhtgs5Ai8T9yRQJXA
        uid:
          description: The sink's UID.
          type: string
          maxLength: 60
          minLength: 1
          pattern: ^(?!sink_)[a-zA-Z0-9_-]+$
          example: unique-identifier
          nullable: true
        status:
          $ref: '#/components/schemas/SinkStatus'
        currentIterator:
          type: string
        failureReason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        batchSize:
          type: integer
          format: int32
        maxWaitSecs:
          type: integer
          format: int32
        eventTypes:
          type: array
          default: []
          items:
