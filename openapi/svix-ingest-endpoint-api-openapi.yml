        source: "svix.ingest()\n    .endpoint()\n    .set_transformation(\n        \"src_31Dc4Mx7vQVLfxFgArIhq\".to_string(),\n        \"ep_33ZIBDmz66FcPG35FnsbM6Ie4X1\".to_string(),\n        IngestEndpointTransformationPatch {\n            code: js_option::JsOption::Some(\"sample string\".to_string()),\n            enabled: Some(true),\n        },\n    )\n    .await?;"
      - label: C#
        lang: C#
        source: "var response = svix.Ingest.Endpoint.SetTransformation(\n    \"src_31Dc4Mx7vQVLfxFgArIhq\",\n    \"ep_33ZIBDmz66FcPG35FnsbM6Ie4X1\",\n    new IngestEndpointTransformationPatch { Code = \"sample string\", Enabled = true }\n);"
      - label: PHP
        lang: PHP
        source: "$svix->ingest->endpoint->setTransformation(\n    \"src_31Dc4Mx7vQVLfxFgArIhq\",\n    \"ep_33ZIBDmz66FcPG35FnsbM6Ie4X1\",\n    IngestEndpointTransformationPatch::create()\n    ->withCode(\"sample string\")\n    ->withEnabled(true)\n);"
      - label: CLI
        lang: Shell
        source: "svix ingest endpoint set-transformation \"src_31Dc4Mx7vQVLfxFgArIhq\" \"ep_33ZIBDmz66FcPG35FnsbM6Ie4X1\" '{\n    \"code\": \"sample string\",\n    \"enabled\": true\n  }'"
      - label: cURL
        lang: Shell
        source: "curl -X 'PATCH' \\\n  'https://api.eu.svix.com/ingest/api/v1/source/src_31Dc4Mx7vQVLfxFgArIhq/endpoint/ep_33ZIBDmz66FcPG35FnsbM6Ie4X1/transformation' \\\n  -H 'Authorization: Bearer AUTH_TOKEN' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\n    \"code\": \"sample string\",\n    \"enabled\": true\n  }'"
components:
  schemas:
    IngestEndpointSecretIn:
      type: object
      properties:
        key:
          description: 'The endpoint''s verification secret.


            Format: `base64` encoded random bytes optionally prefixed with `whsec_`.

            It is recommended to not set this and let the server generate the secret.'
          default: null
          type: string
          pattern: ^(whsec_)?[a-zA-Z0-9+/=]{32,100}$
          example: whsec_C2FVsBQIhrscChlQIMV+b5sSYspob7oD
          nullable: true
    IngestEndpointTransformationOut:
      type: object
      properties:
        code:
          type: string
          maxLength: 51200
          minLength: 10
          nullable: true
        enabled:
          default: false
          type: boolean
    HTTPValidationError:
      type: object
      required:
      - detail
      properties:
        detail:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
    ValidationError:
      description: Validation errors have their own schema to provide context for invalid requests eg. mismatched types and out of bounds values. There may be any number of these per 422 UNPROCESSABLE ENTITY error.
      type: object
      required:
      - loc
      - msg
      - type
      properties:
        loc:
          description: The location as a [`Vec`] of [`String`]s -- often in the form `["body", "field_name"]`, `["query", "field_name"]`, etc. They may, however, be arbitrarily deep.
          type: array
          items:
            type: string
        msg:
          description: The message accompanying the validation error item.
          type: string
        type:
          description: The type of error, often "type_error" or "value_error", but sometimes with more context like as "value_error.number.not_ge"
          type: string
    IngestEndpointHeadersIn:
      type: object
      required:
      - headers
      properties:
        headers:
          type: object
          additionalProperties:
            type: string
          example:
            X-Example: '123'
            X-Foobar: Bar
    IngestEndpointHeadersOut:
      type: object
      required:
      - headers
      - sensitive
      properties:
        headers:
          type: object
          additionalProperties:
            type: string
          example:
            X-Example: '123'
            X-Foobar: Bar
        sensitive:
          type: array
          items:
            type: string
          uniqueItems: true
          example:
          - Authorization
    IngestEndpointIn:
      type: object
      required:
      - url
      properties:
        description:
          default: ''
          type: string
          example: An example endpoint name
        disabled:
          default: false
          type: boolean
          example: false
        metadata:
          default: {}
          type: object
          additionalProperties:
            type: string
        rateLimit:
          type: integer
          format: uint16
          minimum: 1.0
          nullable: true
        secret:
          description: 'The endpoint''s verification secret.


            Format: `base64` encoded random bytes optionally prefixed with `whsec_`.

            It is recommended to not set this and let the server generate the secret.'
          type: string
          pattern: ^(whsec_)?[a-zA-Z0-9+/=]{32,100}$
          example: whsec_C2FVsBQIhrscChlQIMV+b5sSYspob7oD
          nullable: true
        uid:
          description: Optional unique identifier for the endpoint.
          type: string
          maxLength: 256
          minLength: 1
          pattern: ^[a-zA-Z0-9\-_.]+$
          example: unique-identifier
          nullable: true
        url:
          type: string
          format: uri
          maxLength: 65536
          minLength: 1
          example: https://example.com/webhook/
    IngestEndpointTransformationPatch:
      type: object
      properties:
        code:
          type: string
          maxLength: 51200
          minLength: 10
          nullable: true
        enabled:
          type: boolean
    IngestEndpointUpdate:
      type: object
      required:
      - url
      properties:
        description:
          default: ''
          type: string
          example: An example endpoint name
        disabled:
          default: false
          type: boolean
          example: false
        metadata:
          default: {}
          type: object
          additionalProperties:
            type: string
        rateLimit:
          type: integer
          format: uint16
          minimum: 1.0
          nullable: true
        uid:
          description: Optional unique identifier for the endpoint.
          type: string
          maxLength: 256
          minLength: 1
          pattern: ^[a-zA-Z0-9\-_.]+$
          example: unique-identifier
          nullable: true
        url:
          type: string
          format: uri
          maxLength: 65536
          minLength: 1
          example: https://example.com/webhook/
    ListResponse_IngestEndpointOut_:
      type: object
      required:
      - data
      - done
      - iterator
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/IngestEndpointOut'
        done:
          type: boolean
        iterator:
          type: string
          example: iterator
          nullable: true
        prevIterator:
          type: string
          example: -iterator
          nullable: true
    Ordering:
      description: Defines the ordering in a listing of results.
      type: string
      enum:
      - ascending
      - descending
    IngestEndpointOut:
      type: object
      required:
      - createdAt
      - description
      - id
      - metadata
      - updatedAt
      - url
      properties:
        createdAt:
          type: string
          format: date-time
        description:
          description: An example endpoint name.
          type: string
        disabled:
          default: false
          type: boolean
          example: false
        id:
          description: The Endpoint's ID.
          type: string
          maxLength: 30
          minLength: 30
          pattern: ^ep_[A-Za-z0-9]{27}$
          example: ep_1srOrx2ZWZBpBUvZwXKQmoEYga2
        metadata:
          type: object
          additionalProperties:
            type: string
        rateLimit:
          type: integer
          format: uint16
          minimum: 0.0
          nullable: true
        uid:
          description: Optional unique identifier for the endpoint.
          type: string
          maxLength: 256
          minLength: 1
          pattern: ^[a-zA-Z0-9\-_.]+$
          example: unique-identifier
          nullable: true
        updatedAt:
          type: string
          format: date-time
        url:
          type: string
          format: uri
          maxLength: 65536
          minLength: 1
          example: https://example.com/webhook/
    IngestEndpointSecretOut:
      type: object
      required:
      - key
      properties:
        key:
          description: 'The endpoint''s verification secret.


            Format: `base64` encoded random bytes optionally prefixed with `whsec_`.

            It is recommended to not set this and let the server generate the secret.'
          type: string
          pattern: ^(whsec_)?[a-zA-Z0-9+/=]{32,100}$
          example: whsec_C2FVsBQIhrscChlQIMV+b5sSYspob7oD
    HttpErrorOut:
      title: HttpError
      type: object
      required:
      - code
      - detail
      properties:
        code:
          type: string
        detail:
          type: string
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
      description: HTTP Bearer token passed in the `Authorization` header
