        lang: Python
        source: "response = svix.streaming.event_type.create(\n    StreamEventTypeIn(\n        archived=True,\n        deprecated=True,\n        description=\"sample string\",\n        feature_flags=[\n            \"cool-new-feature\",\n        ],\n        name=\"user.signup\",\n    ),\n)"
      - label: Python (Async)
