    patch:
      tags:
      - Stream Event Type
      summary: Patch Stream Event Type
      description: Patch an event type for Streams.
      operationId: v1.streaming.event-type.patch
      parameters:
      - in: path
        name: name
        description: The event type's name
        required: true
        schema:
          description: The event type's name
          type: string
          maxLength: 256
          pattern: ^[a-zA-Z0-9\-_.]+$
          example: user.signup
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StreamEventTypePatch'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamEventTypeOut'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpErrorOut'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpErrorOut'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpErrorOut'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpErrorOut'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpErrorOut'
      security:
      - HTTPBearer: []
      x-codeSamples:
      - label: JavaScript
        lang: TypeScript
        source: "const response = await svix.streaming.eventType.patch(\"name\", {\n  archived: true,\n  deprecated: true,\n  description: \"sample string\",\n  featureFlags: [\"cool-new-feature\"],\n  name: \"user.signup\",\n});"
      - label: TypeScript
        lang: TypeScript
        source: "const response = await svix.streaming.eventType.patch(\"name\", {\n  archived: true,\n  deprecated: true,\n  description: \"sample string\",\n  featureFlags: [\"cool-new-feature\"],\n  name: \"user.signup\",\n});"
      - label: Python
        lang: Python
        source: "response = svix.streaming.event_type.patch(\n    \"name\",\n    StreamEventTypePatch(\n        archived=True,\n        deprecated=True,\n        description=\"sample string\",\n        feature_flags=[\n            \"cool-new-feature\",\n        ],\n        name=\"user.signup\",\n    ),\n)"
      - label: Python (Async)
        lang: Python
        source: "response = await svix.streaming.event_type.patch(\n    \"name\",\n    StreamEventTypePatch(\n        archived=True,\n        deprecated=True,\n        description=\"sample string\",\n        feature_flags=[\n            \"cool-new-feature\",\n        ],\n        name=\"user.signup\",\n    ),\n)"
      - label: Go
        lang: Go
        source: "response, err := svix.Streaming.EventType.Patch(\n\tctx,\n\t\"name\",\n\tStreamEventTypePatch{\n\t\tArchived:     new(true),\n\t\tDeprecated:   new(true),\n\t\tDescription:  NewNullable(\"sample string\"),\n\t\tFeatureFlags: NewNullable([]string{\"cool-new-feature\"}),\n\t\tName:         NewNullable(\"user.signup\"),\n\t},\n)"
      - label: Kotlin
        lang: Kotlin
        source: "val response =\n    svix.streaming.eventType.patch(\n        \"name\",\n        StreamEventTypePatch(\n            archived = true,\n            deprecated = true,\n            description = MaybeUnset.Present(\"sample string\"),\n            featureFlags = MaybeUnset.Present(setOf(\"cool-new-feature\")),\n            name = MaybeUnset.Present(\"user.signup\"),\n        ),\n    )"
      - label: Java
        lang: Java
        source: "var response = svix.getStreaming()\n        .getEventType()\n        .patch(\n            \"name\",\n            new StreamEventTypePatch()\n                .archived(true)\n                .deprecated(true)\n                .description(\"sample string\")\n                .featureFlags(Set.of(\"cool-new-feature\"))\n                .name(\"user.signup\"));"
      - label: Ruby
        lang: Ruby
        source: "response = svix\n  .streaming\n  .event_type\n  .patch(\n    \"name\",\n    {\n      archived: true,\n      deprecated: true,\n      description: \"sample string\",\n      featureFlags: [\"cool-new-feature\"],\n      name: \"user.signup\"\n    }\n  )"
      - label: Rust
        lang: Rust
        source: "let response = svix\n    .streaming()\n    .event_type()\n    .patch(\n        \"name\".to_string(),\n        StreamEventTypePatch {\n            archived: Some(true),\n            deprecated: Some(true),\n            description: js_option::JsOption::Some(\"sample string\".to_string()),\n            feature_flags: js_option::JsOption::Some(\n                vec![\"cool-new-feature\".to_string()],\n            ),\n            name: js_option::JsOption::Some(\"user.signup\".to_string()),\n        },\n    )\n    .await?;"
      - label: C#
