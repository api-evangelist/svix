components:
  schemas:
    RecoverIn:
      type: object
      required:
      - since
      properties:
        since:
          type: string
          format: date-time
        until:
          type: string
          format: date-time
          nullable: true
    RecoverOut:
      type: object
      required:
      - id
      - status
      - task
      - updatedAt
      properties:
        id:
          description: The QueueBackgroundTask's ID.
          type: string
          maxLength: 33
          minLength: 33
          pattern: ^qtask_[A-Za-z0-9]{27}$
          example: qtask_1srOrx2ZWZBpBUvZwXKQmoEYga2
        status:
          $ref: '#/components/schemas/BackgroundTaskStatus'
        task:
          $ref: '#/components/schemas/BackgroundTaskType'
        updatedAt:
          type: string
          format: date-time
    ValidationError:
      description: Validation errors have their own schema to provide context for invalid requests eg. mismatched types and out of bounds values. There may be any number of these per 422 UNPROCESSABLE ENTITY error.
      type: object
      required:
      - loc
      - msg
      - type
      properties:
        loc:
          description: The location as a [`Vec`] of [`String`]s -- often in the form `["body", "field_name"]`, `["query", "field_name"]`, etc. They may, however, be arbitrarily deep.
          type: array
          items:
            type: string
        msg:
          description: The message accompanying the validation error item.
          type: string
        type:
          description: The type of error, often "type_error" or "value_error", but sometimes with more context like as "value_error.number.not_ge"
          type: string
    StatusCodeClass:
      title: StatusCodeClass
      description: 'The different classes of HTTP status codes:


        - CodeNone = 0

        - Code1xx = 100

        - Code2xx = 200

        - Code3xx = 300

        - Code4xx = 400

        - Code5xx = 500'
      type: integer
      enum:
      - 0
      - 100
      - 200
      - 300
      - 400
      - 500
      x-enum-varnames:
      - CodeNone
      - Code1xx
      - Code2xx
      - Code3xx
      - Code4xx
      - Code5xx
    Ordering:
      description: Defines the ordering in a listing of results.
      type: string
      enum:
      - ascending
      - descending
    ListResponse_EndpointOut_:
      type: object
      required:
      - data
      - done
      - iterator
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/EndpointOut'
        done:
          type: boolean
        iterator:
          type: string
          example: iterator
          nullable: true
        prevIterator:
          type: string
          example: -iterator
          nullable: true
    EndpointTransformationPatch:
      type: object
      properties:
        code:
          type: string
          maxLength: 51200
          minLength: 10
          example: function handler(webhook) { /* ... */ }
          nullable: true
        enabled:
          type: boolean
        variables:
          type: object
          additionalProperties:
            type: string
          nullable: true
    ReplayIn:
      type: object
      required:
      - since
      properties:
        since:
          type: string
          format: date-time
        until:
          type: string
          format: date-time
          nullable: true
    MessageOut:
      type: object
      required:
      - eventType
      - id
      - payload
      - timestamp
      properties:
        channels:
          description: List of free-form identifiers that endpoints can filter by
          type: array
          items:
            type: string
            maxLength: 128
            pattern: ^[a-zA-Z0-9\-_.:]+$
            example: project_1337
          maxItems: 10
          minItems: 1
          uniqueItems: true
          example:
          - project_123
          - group_2
          nullable: true
        deliverAt:
          type: string
          format: date-time
          nullable: true
        eventId:
          description: Optional unique identifier for the message
          type: string
          maxLength: 256
          minLength: 1
          pattern: ^[a-zA-Z0-9\-_.]+$
          example: unique-identifier
          nullable: true
        eventType:
          description: The event type's name
          type: string
          maxLength: 256
          pattern: ^[a-zA-Z0-9\-_.]+$
          example: user.signup
        id:
          description: The Message's ID.
          type: string
          maxLength: 31
          minLength: 31
          pattern: ^msg_[A-Za-z0-9]{27}$
          example: msg_1srOrx2ZWZBpBUvZwXKQmoEYga2
        payload:
          type: object
          example:
            email: test@example.com
            type: user.created
            username: test_user
        tags:
          type: array
          items:
