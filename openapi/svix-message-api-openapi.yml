components:
  schemas:
    PollerV2MessageOut:
      description: The MessageOut equivalent of polling endpoint
      type: object
      properties:
        offset:
          type: integer
          format: uint64
          minimum: 0.0
        headers:
          type: object
          additionalProperties:
            type: string
          nullable: true
        eventId:
          description: Optional unique identifier for the message
          type: string
          maxLength: 256
          minLength: 1
          pattern: ^[a-zA-Z0-9\-_.]+$
          example: unique-identifier
          nullable: true
        eventType:
          description: The event type's name
          type: string
          maxLength: 256
          pattern: ^[a-zA-Z0-9\-_.]+$
          example: user.signup
        payload:
          type: object
          additionalProperties: true
          example:
            type: user.created
            email: test@example.com
            username: test_user
        channels:
          description: List of free-form identifiers that endpoints can filter by
          type: array
          nullable: true
          items:
            type: string
            maxLength: 128
            pattern: ^[a-zA-Z0-9\-_.:+]+$
            example: project_1337
          maxItems: 10
          minItems: 1
          uniqueItems: true
          example:
          - project_123
          - group_2
        id:
          description: The Message's ID.
          type: string
          maxLength: 31
          minLength: 31
          pattern: ^msg_[A-Za-z0-9]{27}$
          example: msg_1srOrx2ZWZBpBUvZwXKQmoEYga2
        timestamp:
          type: string
          format: date-time
        tags:
          type: array
          items:
            type: string
            maxLength: 128
            pattern: ^[a-zA-Z0-9\-_./\\#]+$
            example: project_1337
          uniqueItems: true
          nullable: true
        deliverAt:
          type: string
          format: date-time
          nullable: true
      required:
      - eventType
      - id
      - offset
      - payload
      - timestamp
    ExpungeAllContentsOut:
      type: object
      properties:
        id:
          description: The QueueBackgroundTask's ID.
          type: string
          maxLength: 33
          minLength: 33
          pattern: ^qtask_[A-Za-z0-9]{27}$
          example: qtask_1srOrx2ZWZBpBUvZwXKQmoEYga2
        status:
          $ref: '#/components/schemas/BackgroundTaskStatus'
        task:
          $ref: '#/components/schemas/BackgroundTaskType'
        updatedAt:
          type: string
          format: date-time
      required:
      - id
      - status
      - task
      - updatedAt
    PollerV2PollOut:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PollerV2MessageOut'
