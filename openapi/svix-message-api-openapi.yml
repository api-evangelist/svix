            maxLength: 128
            pattern: ^[a-zA-Z0-9\-_.:+]+$
            example: project_1337
          maxItems: 10
          minItems: 1
          uniqueItems: true
          example:
          - project_123
          - group_2
      required:
      - eventType
    MessageStatusText:
      type: string
      enum:
      - success
      - pending
      - fail
      - sending
      - canceled
    MessageRawPayloadOut:
      type: object
      properties:
        payload:
          type: string
          example: '{"email":"test@example.com","type":"user.created","username":"test_user"}'
      required:
      - payload
    ListResponse_MessageOut_:
      type: object
      properties:
        data:
          type: array
