          type: integer
          format: uint16
          minimum: 1
          nullable: true
        uid:
          description: Optional unique identifier for the application.
          type: string
          maxLength: 256
          minLength: 1
          pattern: ^[a-zA-Z0-9\-_.]+$
          example: unique-identifier
          nullable: true
        metadata:
          type: object
          default: {}
          additionalProperties:
            type: string
      required:
      - name
    PollerV2CommitIn:
      type: object
      properties:
        offset:
          type: integer
          format: uint64
          minimum: 0.0
      required:
      - offset
    BackgroundTaskStatus:
      type: string
      enum:
      - running
      - finished
      - failed
    MessagePrecheckIn:
      type: object
      properties:
        eventType:
          description: The event type's name
