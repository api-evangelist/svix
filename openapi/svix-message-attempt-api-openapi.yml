components:
  schemas:
    MessageAttemptOut:
      type: object
      properties:
        url:
          type: string
          format: uri
          minLength: 1
          maxLength: 65536
          example: https://example.com/webhook/
        response:
          type: string
          example: '{}'
        responseStatusCode:
          type: integer
          format: int16
          example: 200
        responseDurationMs:
          description: Response duration in milliseconds.
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/MessageStatus'
        statusText:
          $ref: '#/components/schemas/MessageStatusText'
        triggerType:
          $ref: '#/components/schemas/MessageAttemptTriggerType'
        msgId:
          description: The Message's ID.
          type: string
          maxLength: 31
          minLength: 31
          pattern: ^msg_[A-Za-z0-9]{27}$
          example: msg_1srOrx2ZWZBpBUvZwXKQmoEYga2
        endpointId:
          description: The Endpoint's ID.
          type: string
          maxLength: 30
          minLength: 30
          pattern: ^ep_[A-Za-z0-9]{27}$
          example: ep_1srOrx2ZWZBpBUvZwXKQmoEYga2
        id:
          description: The MessageAttempt's ID.
          type: string
          maxLength: 33
          minLength: 33
          pattern: ^atmpt_[A-Za-z0-9]{27}$
          example: atmpt_1srOrx2ZWZBpBUvZwXKQmoEYga2
        timestamp:
          type: string
          format: date-time
        msg:
          $ref: '#/components/schemas/MessageOut'
          nullable: true
      required:
      - endpointId
      - id
      - msgId
      - response
      - responseDurationMs
      - responseStatusCode
      - status
      - statusText
      - timestamp
      - triggerType
      - url
    ListResponse_MessageEndpointOut_:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MessageEndpointOut'
        iterator:
          type: string
          nullable: true
          example: iterator
        prevIterator:
          type: string
          nullable: true
          example: -iterator
        done:
          type: boolean
      required:
      - data
      - done
      - iterator
    CountOut:
      type: object
      properties:
        count:
          description: The count of attempts matching the query.
          type: integer
          format: uint64
          minimum: 0.0
        approximated:
          description: There's a ceiling to how many attempts we count. When the limit is reached, this will be `true` to indicate the actual count is higher than given.
          type: boolean
      required:
      - approximated
      - count
    HttpErrorOut:
      title: HttpError
      type: object
      properties:
        code:
          type: string
        detail:
          type: string
      required:
      - code
      - detail
    MessageStatus:
      title: MessageStatus
      description: 'The sending status of the message:


        - Success = 0

        - Pending = 1

        - Fail = 2

        - Sending = 3

        - Canceled = 4'
      type: integer
      enum:
      - 0
      - 1
      - 2
      - 3
      - 4
      x-enum-varnames:
      - Success
      - Pending
      - Fail
      - Sending
      - Canceled
    MessageEndpointOut:
      type: object
      properties:
        id:
          description: The Endpoint's ID.
          type: string
          maxLength: 30
          minLength: 30
          pattern: ^ep_[A-Za-z0-9]{27}$
          example: ep_1srOrx2ZWZBpBUvZwXKQmoEYga2
        status:
          $ref: '#/components/schemas/MessageStatus'
        statusText:
          $ref: '#/components/schemas/MessageStatusText'
        nextAttempt:
          type: string
          format: date-time
          nullable: true
        url:
          type: string
          format: uri
          minLength: 1
          maxLength: 65536
          example: https://example.com/webhook/
        description:
          type: string
        rateLimit:
          description: Deprecated, use `throttleRate` instead.
          type: integer
          format: uint16
          deprecated: true
          minimum: 0
          nullable: true
        throttleRate:
          description: 'Maximum messages per second to send to this endpoint.


            Outgoing messages will be throttled to this rate.'
          type: integer
          format: uint16
          minimum: 0
          nullable: true
        uid:
          description: Optional unique identifier for the endpoint.
          type: string
          maxLength: 256
          minLength: 1
          pattern: ^[a-zA-Z0-9\-_.]+$
          example: unique-identifier
          nullable: true
        version:
          type: integer
          format: int32
          deprecated: true
          minimum: 1
          example: 1
        disabled:
          type: boolean
          default: false
          example: false
        filterTypes:
          type: array
          nullable: true
          items:
            description: The event type's name
            type: string
            maxLength: 256
            pattern: ^[a-zA-Z0-9\-_.]+$
            example: user.signup
          minItems: 1
          uniqueItems: true
          example:
          - user.signup
          - user.deleted
        channels:
          description: List of message channels this endpoint listens to (omit for all).
          type: array
          nullable: true
          items:
            type: string
            maxLength: 128
            pattern: ^[a-zA-Z0-9\-_.:+]+$
            example: project_1337
          maxItems: 10
          minItems: 1
          uniqueItems: true
          example:
          - project_123
          - group_2
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
      - createdAt
      - description
      - id
      - status
      - statusText
      - updatedAt
      - url
      - version
    MessageAttemptHeadersOut:
      type: object
      properties:
        sentHeaders:
          type: object
          additionalProperties:
            type: string
        responseHeaders:
          type: array
          items:
            type: array
            items:
              type: string
            maxItems: 2
            minItems: 2
          nullable: true
        sensitive:
          type: array
          items:
            type: string
          uniqueItems: true
      required:
