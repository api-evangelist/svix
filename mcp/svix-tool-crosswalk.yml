  confidence_low: 0

gaps:
  - id: no-transformation-dry-run-tool
    detail: |
      update_transformation (write, live config) is exposed but
      v1.endpoint.transformation-simulate is not, so an agent can push
      transformation code to a live endpoint with no tool to test it first. The
      REST operation to do it safely exists; only the tool is missing.
  - id: no-poller-tools
    detail: |
      Polling endpoints are the documented consumer-side alternative to webhooks
      and are entirely absent from the tool set, so a consumer using polling gets
      no agent surface at all.
  - id: schemas-require-auth
    detail: |
      tools/list is 401 anonymously, so no published inputSchema exists for these
      13 tools outside an authenticated session. The bindings above are the only
      machine-readable route from a tool name to a real parameter contract.
