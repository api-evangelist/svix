gaps:
  - id: security-txt-no-expires
    detail: |
      www.svix.com/.well-known/security.txt omits the `Expires:` field, which
      RFC 9116 section 2.5.5 makes REQUIRED. Adding it (and a `Policy:` URL) is
      a one-line fix on Svix's side.
  - id: no-api-catalog
    detail: |
      No RFC 9727 /.well-known/api-catalog on any host, despite Svix publishing
      a complete OpenAPI at api.svix.com/api/v1/openapi.json. A catalog document
      pointing at that spec would make the contract discoverable without docs.
