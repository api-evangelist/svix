    registry: npm
    name: svix
    url: https://www.npmjs.com/package/svix
    install: npm install svix
    official: true
    version: 1.99.1
    published: '2026-07-23'
    source_repo: https://github.com/svix/svix-webhooks

  - language: python
    registry: pypi
    name: svix
    url: https://pypi.org/project/svix/
    install: pip install svix
    official: true
    version: 1.99.1
    published: '2026-07-23'
    source_repo: https://github.com/svix/svix-webhooks

  - language: ruby
    registry: rubygems
    name: svix
    url: https://rubygems.org/gems/svix
    install: gem install svix
    official: true
    version: 1.99.1
    published: '2026-07-23'
    source_repo: https://github.com/svix/svix-webhooks

  - language: csharp
    registry: nuget
    name: Svix
    url: https://www.nuget.org/packages/Svix
    install: dotnet add package Svix
    official: true
    version: 1.99.1
    published: '2026-07-23'
    source_repo: https://github.com/svix/svix-webhooks

  - language: go
    registry: go-modules
    name: github.com/svix/svix-webhooks
    url: https://pkg.go.dev/github.com/svix/svix-webhooks/go
    install: go get github.com/svix/svix-webhooks/go
    official: true
    version: v1.99.1
    published: '2026-07-23'
    source_repo: https://github.com/svix/svix-webhooks
    note: |
      proxy.golang.org resolves the module at the repository root
      (github.com/svix/svix-webhooks@v1.99.1); the importable package is the
      /go subdirectory, which has no separate module version of its own.

  - language: java
    registry: maven-central
    name: com.svix:svix
    url: https://central.sonatype.com/artifact/com.svix/svix
    install: 'implementation "com.svix:svix:1.99.1"'
    official: true
    version: 2.0.0-rc.2
    published: '2026-07-28'
    latest_stable: 1.99.1
    note: |
      maven-metadata.xml lists 132 versions; the newest is the 2.0.0 release
      candidate. 1.99.1 is the newest stable.

  - language: kotlin
    registry: maven-central
    name: com.svix.kotlin:svix-kotlin
    url: https://central.sonatype.com/artifact/com.svix.kotlin/svix-kotlin
    install: 'implementation "com.svix.kotlin:svix-kotlin:1.99.1"'
    official: true
    version: 2.0.0-rc.2
    published: '2026-07-28'
    latest_stable: 1.99.1

  - language: php
    registry: packagist
    name: svix/svix
    url: https://packagist.org/packages/svix/svix
    install: composer require svix/svix
    official: true
    version: 2.0.0-rc.2
    published: '2026-07-28'
    latest_stable: 1.99.1
    note: Packagist resolves the newest tag, which is currently the 2.0.0 RC.

  - language: rust
    registry: crates.io
    name: svix
    url: https://crates.io/crates/svix
    install: cargo add svix
    official: true
    version: 2.0.0-rc.2
    published: '2026-07-28'
    latest_stable: 1.99.1
    note: |
      Svix's server and CLI are written in Rust; crates.io carries the client
      library. max_version is the 2.0.0 release candidate.

  - language: javascript
    registry: npm
    name: svix-cli
    kind: cli
    url: https://www.npmjs.com/package/svix-cli
    install: npx svix-cli
    official: true
    version: 1.99.0
    published: '2026-07-23'
    source_repo: https://github.com/svix/svix-webhooks
    note: |
      npm distribution of the Go-built Svix CLI; see cli/svix-cli.yml for the
      command surface and the non-npm install channels (Homebrew, Scoop, AUR,
      deb/rpm, GitHub releases).

  - language: javascript
    registry: npm
    name: svix-react
    kind: ui-component
    url: https://www.npmjs.com/package/svix-react
    install: npm install svix-react
    official: true
    version: 1.13.9
    published: '2026-03-10'
    note: |
      React components for embedding the Consumer App Portal in your own
      dashboard. Published by the svixdev/tasn npm maintainers (same accounts
      that publish `svix`), but on its own release cadence — 5 months behind the
      server-SDK train, which is expected for a UI wrapper rather than an
      abandonment signal. See components/svix-components.yml.

  - language: multi
    registry: null
    name: standardwebhooks
    kind: specification-library
    url: https://www.standardwebhooks.com
    official: false
    version: null
    published: null
    note: |
      Standard Webhooks is the open specification Svix co-authored and its
      libraries are the recommended receiver-side dependency, but they are
      published by the Standard Webhooks project rather than by Svix, so they
      are recorded here as related-not-first-party. version/published left null
      deliberately: this row names an ecosystem, not one registry artifact.

