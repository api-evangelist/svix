generated: '2026-08-13'
method: searched
source: |
  Registry metadata endpoints queried unauthenticated on 2026-08-13
  (registry.npmjs.org, pypi.org, rubygems.org, crates.io, azuresearch-usnc.nuget.org,
  repo1.maven.org, repo.packagist.org, proxy.golang.org), cross-checked against
  https://github.com/svix/svix-webhooks (the monorepo every SDK is generated from)
  and https://docs.svix.com/.
note: |
  Svix generates every server SDK from one OpenAPI document in the svix-webhooks
  monorepo, so the whole polyglot set moves together on a single release train —
  v1.99.1 shipped to npm, PyPI, RubyGems, NuGet, Maven Central and the Go proxy on
  the same day (2026-07-23). A v2.0.0 release candidate line (2.0.0-rc.2, 2026-07-28)
  is published ahead of the stable channel on crates.io, Packagist and Maven Central;
  those two registries currently resolve "latest" to the RC rather than to 1.99.1.
  No SDK in this set is stale relative to the API: the live contract at
  api.svix.com/api/v1/openapi.json reports info.version 1.922.0 and the SDK train
  is 3 weeks old at time of writing.
release_train:
  monorepo: https://github.com/svix/svix-webhooks
  stable: 1.99.1
  stable_published: '2026-07-23'
  prerelease: 2.0.0-rc.2
  prerelease_published: '2026-07-28'
  changelog: https://github.com/svix/svix-webhooks/blob/main/ChangeLog.md

packages:
