    mistake. The root ChangeLog.md covers the client SDKs and the CLI;
    server/ChangeLog.md covers the self-hostable open-source server;
    bridge/ChangeLog.md covers Svix Bridge. None of them tracks the hosted API build
    number (info.version 1.922.0), which has no public changelog at all.
