  - version: 2.0.0-rc.2
    date: '2026-07-28'
    stream: sdks-and-cli
    breaking: false
    highlights:
      - 'Libs/JS: fix a publishing issue.'

  - version: 2.0.0-rc.1
    date: '2026-07-24'
    stream: sdks-and-cli
    breaking: true
    highlights:
      - Remove deprecated operations and most deprecated fields.
      - '`with_content` now defaults to false on several message/attempt operations — create-message no longer mirrors back the payload, and list-attempts-by-endpoint no longer returns response payloads by default.'
      - 'Rename `filterTypes` to `eventTypes` on endpoint and related models.'
      - 'Rename every `update` operation to `upsert` (Applications, Endpoints, Event Types, Connectors, Ingest Sources, Streams, Sinks) — they were always create-or-update.'
      - 'Rename `ingest.dashboard` to `ingest.authentication.consumer-portal-access`.'
      - 'Rename `endpoint.update-headers` to `endpoint.set-headers` (and the ingest equivalents).'
      - 'Remove `svix.operationalWebhookEndpoint` in favour of `svix.operationalWebhook.endpoint`; remove operational-webhook model types.'
      - 'Libs/JavaScript: drop CommonJS; snake_case resource accessors become camelCase.'
      - 'Libs/Python: stop returning parsed JSON from `Webhook.verify`.'
      - 'Libs/Kotlin: upgrade to Kotlin 2.3.20; timestamps become kotlin.time.Instant.'
      - 'Libs/Go: resource accessors become methods (`svix.Ingest().Endpoint()`).'
      - 'Libs/Rust: timestamps become chrono::DateTime<Utc>; constructor parameter order normalised.'
      - 'Libs/Java: `throttleRate` narrows from Long to Short.'
    note: |
      The breaking change with the widest blast radius is the `with_content` default
      flip — it changes what a working 1.x client RECEIVES without changing what it
      sends, so it fails silently rather than loudly.

