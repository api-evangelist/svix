unreleased:
  breaking: true
  highlights:
    - '`PatchConfig`-suffixed types become `ConfigPatch`-suffixed, so SDKs can distinguish "keep as-is" from "unset".'
    - 'Non-patch `Config` types (S3Config, GoogleCloudPubSubConfig, …) split into `*ConfigIn` / `*ConfigOut`, fixing response deserialization.'
    - 'Rename `SinkOtelTracingConfig*` to `OtelTracingConfig*`.'
    - Many sink config fields become optional ahead of future auth changes.
    - 'Libs/Kotlin: add the missing background-task, connector, environment and health APIs.'
    - 'Libs/Ruby, Libs/PHP: webhook verification timestamp tolerance is now configurable (defaults to the previously hardcoded five minutes).'

