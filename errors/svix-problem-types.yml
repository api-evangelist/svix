rfc9457_note: Svix does NOT use RFC 9457 problem+json — `application/problem+json` appears zero times
  in the contract. Errors are a plain JSON object with `code` (a machine-readable string) and `detail`
  (a human string). That is a well-formed envelope with a stable machine field, so an agent can branch
  on it; it simply is not the IETF standard, and there is no `type` URI to dereference.
envelope:
  schema: HttpErrorOut
  fields:
  - name: code
    type: string
    required: true
    note: Machine-readable error identifier. Branch on this, not on `detail`.
  - name: detail
    type: string
    required: true
    note: Human-readable explanation.
  media_type: application/json
validation_envelope:
  schema: HTTPValidationError
  status: 422
  fields:
  - name: detail
    type: array<ValidationError>
    required: true
  item_schema: ValidationError
  item_fields:
  - loc
  - msg
  - type
  note: ValidationError.loc is an arbitrarily deep array of strings, usually ["body","field_name"] or
    ["query","field_name"]. There may be any number per 422.
consistency:
  note: 'Unusually uniform: 400, 401, 403, 404, 409, 422 and 429 are declared on ALL 230 operations. 413
    is declared on exactly one. No operation declares a 5xx, so server-side failure modes are undocumented
    in the contract.'
  declared_on_all_operations:
